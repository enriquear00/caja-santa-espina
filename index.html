<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7a2335">
<title>Caja Santa Espina</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Caja Espina">
<style>
/* App de caja sin conexión: selector Entradas/Tienda arriba, total y método de pago, rejilla de botones grandes, pestañas abajo */
:root{
  --bg:#f2f0ee; --surface:#ffffff; --ink:#221d1f; --muted:#6f676a; --line:#e2dcdb;
  --accent:#7a2335; --accent-ink:#ffffff; --accent-soft:#f1e1e4; --warn:#a4462a; --ok:#2f6b4f;
  --card:#2f5d9e; --card-ink:#ffffff; --card-soft:#dde6f3; --gold:#9a7a2c;
  --display:Georgia,"Times New Roman",serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#151213; --surface:#1f1a1c; --ink:#efeaeb; --muted:#a39a9d; --line:#332c2f;
  --accent:#e08597; --accent-ink:#2a0d14; --accent-soft:#3b2128; --warn:#e58566; --ok:#6cc79c;
  --card:#86abe6; --card-ink:#0d1a2c; --card-soft:#1e2b3f; --gold:#d6b866; color-scheme:dark}}
body.s-tie{--accent:#3d6b3a;--accent-ink:#ffffff;--accent-soft:#e1ecdc}
body.s-bar{--accent:#8a4b1f;--accent-ink:#ffffff;--accent-soft:#f4e5d6}
@media (prefers-color-scheme:dark){body.s-tie{--accent:#93c48c;--accent-ink:#0f200e;--accent-soft:#1f3320}body.s-bar{--accent:#e3a46f;--accent-ink:#2a1405;--accent-soft:#3a2617}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;-webkit-tap-highlight-color:transparent;padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
.app{display:flex;flex-direction:column;min-height:100%;max-width:600px;margin:0 auto}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding-block:10px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.brand{font-family:var(--display);font-variant:small-caps;font-weight:700;font-size:14px;letter-spacing:.1em;color:var(--accent);display:flex;align-items:center;gap:8px}
.brand svg{width:12px;height:12px;flex:none}
.secbar{display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--accent);padding-bottom:8px}
.back{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 12px 7px 9px;font:600 13px var(--body);cursor:pointer}
.secname{font:700 20px var(--display);color:var(--accent)}
#home{min-height:100%;background:var(--bg)}
.home-in{padding-block:22px 40px;display:flex;flex-direction:column;gap:18px;max-width:600px;margin:0 auto}
.home-in h1{font:700 26px var(--display);margin:6px 0 0}
.home-btns{display:flex;flex-direction:column;gap:12px}
.hb{display:flex;align-items:center;gap:14px;text-align:left;width:100%;border:1px solid var(--line);border-left:8px solid var(--c);background:var(--surface);color:var(--ink);border-radius:16px;padding:18px 16px;font:inherit;cursor:pointer;min-height:96px}
.hb:active{transform:scale(.98)}
.hb-ent{--c:#7a2335}.hb-tie{--c:#3d6b3a}.hb-bar{--c:#8a4b1f}
@media (prefers-color-scheme:dark){.hb-ent{--c:#e08597}.hb-tie{--c:#93c48c}.hb-bar{--c:#e3a46f}}
.hb-ic{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;color:var(--c);background:var(--bg);flex:none}.hb-ic svg{width:28px;height:28px}
.hb-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}.hb-t>b{font:700 22px var(--display);color:var(--c)}.hb-t span b{color:var(--ink)}.hb-t span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.hb-go{font-size:28px;color:var(--muted)}
.home-note{text-align:center}
.ticket{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--surface);border-top:2px solid var(--accent);box-shadow:0 -6px 18px rgba(0,0,0,.08);padding-block:10px;max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
body.con-ticket main{padding-bottom:190px}
.tk-row{display:flex;align-items:center;gap:8px}
.tk-l{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.15}.tk-l b{font-size:22px;font-variant-numeric:tabular-nums}
.tk-b{border:0;border-radius:10px;padding:11px 12px;font:700 14px var(--body);background:var(--accent);color:var(--accent-ink);cursor:pointer}
.tk-b.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.tk-b[disabled]{opacity:.45}
.tk-cambio{display:flex;flex-direction:column;gap:8px}
.tk-q{display:flex;gap:6px;flex-wrap:wrap}.tk-q button{flex:1;min-width:56px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px 6px;font:700 15px var(--body);cursor:pointer}
.tk-cambio input{flex:0 0 120px}
.tk-dev{font-size:15px}.tk-dev b{font-size:22px;color:var(--ok)}.tk-dev.bad b{color:var(--warn)}
.semana{padding:12px 14px;display:flex;flex-direction:column;gap:10px}.sem-nav{display:flex;align-items:center;justify-content:space-between;gap:8px}.sem-nav .mini{font-size:16px;padding:6px 14px}
.pages{display:grid;grid-template-columns:1fr 1fr;gap:0;border-bottom:2px solid var(--line)}
.pages button{border:0;background:none;padding:10px 4px 9px;font:700 16px var(--body);color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.pages button[aria-pressed="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.total{font-weight:800;font-size:36px;line-height:1;font-variant-numeric:tabular-nums;margin-top:4px}
.split{text-align:right;font-variant-numeric:tabular-nums;font-size:13px;display:flex;flex-direction:column;gap:3px}
.split b{font-weight:700}
.split>span{white-space:nowrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.dot.ef{background:var(--accent)} .dot.tj{background:var(--card)} .dot.vi{background:var(--gold)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;border-radius:9px;padding:11px 6px;font:700 15px var(--body);background:none;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"][data-m="ef"]{background:var(--accent);color:var(--accent-ink)}
.seg button[aria-pressed="true"][data-m="tj"]{background:var(--card);color:var(--card-ink)}
.seg.tres{grid-template-columns:1fr 1fr 1fr}
.seg button[aria-pressed="true"][data-m="vy"]{background:#0f9d80;color:#fff}
.m-vy .tile.on{border-color:#0f9d80;background:#e3f6f1} .m-vy .badge{background:#0f9d80;color:#fff}
.dot.vy{background:#0f9d80}
.vybox{background:#e3f6f1;border:1px solid #bfe7dc;border-radius:12px;padding:10px 12px;font-size:13px;margin:10px 0}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 13px;font:600 13px var(--body);cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{flex:1;padding-block:14px 100px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:460px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.cell{position:relative;min-width:0}
.tile{position:relative;width:100%;height:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 12px 12px;text-align:left;font:inherit;color:inherit;cursor:pointer;min-height:96px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;transition:transform .08s}
.tile:active{transform:scale(.97)}
.m-ef .tile.on{border-color:var(--accent);background:var(--accent-soft)}
.m-tj .tile.on{border-color:var(--card);background:var(--card-soft)}
.tile .n{font-weight:600;font-size:15px;line-height:1.22;padding-right:34px;word-break:break-word}
.tile .p{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px;font-weight:600}
.tile .p.free{color:var(--gold)}
.badge{position:absolute;top:10px;right:10px;min-width:28px;height:28px;border-radius:14px;font-weight:800;font-size:15px;display:grid;place-items:center;padding:0 6px;font-variant-numeric:tabular-nums}
.m-ef .badge{background:var(--accent);color:var(--accent-ink)} .m-tj .badge{background:var(--card);color:var(--card-ink)}
.minus{position:absolute;bottom:8px;right:8px;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:20px;line-height:1;cursor:pointer}
h3.cat{margin:20px 0 8px;font:700 13px var(--display);font-variant:small-caps;letter-spacing:.1em;color:var(--muted);display:flex;align-items:center;gap:8px}
h3.cat::after{content:"";flex:1;height:1px;background:var(--line)}
h3.cat:first-of-type{margin-top:4px}
.hint{color:var(--muted);font-size:13px;margin:0 0 12px;line-height:1.45}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-block:6px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
nav .in{display:flex;gap:6px;width:100%;max-width:600px}
nav button{flex:1;border:0;background:none;color:var(--muted);font:600 13px var(--body);padding:10px 4px;border-radius:10px;cursor:pointer}
nav button[aria-selected="true"]{background:var(--accent-soft);color:var(--ink)}
h2{font-family:var(--display);font-weight:700;font-size:22px;margin:4px 0 12px}
h3{font-weight:700;font-size:16px;margin:26px 0 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 14px}
.row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0;word-break:break-word}
.row .q{color:var(--muted);width:40px;text-align:right;flex:none}
.row .s{width:78px;text-align:right;font-weight:600;flex:none}
.row.head{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:9px 0}
.row.sub{font:700 12px var(--display);font-variant:small-caps;letter-spacing:.1em;color:var(--muted);padding:12px 0 4px;border-bottom:0}
.row.tot{font-weight:800;font-size:18px}
.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.sum div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 12px;min-width:0}
.sum b{display:block;font-weight:800;font-size:20px;margin-top:4px;font-variant-numeric:tabular-nums}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:15px;font:700 16px var(--body);cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--warn);color:var(--surface)}
.btn[disabled]{opacity:.5;cursor:default}
.exp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.exp .btn{background:var(--surface);color:var(--ink);border:1px solid var(--line);padding:13px;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px}
.ext{font:800 10px var(--body);letter-spacing:.06em;padding:3px 5px;border-radius:5px;color:#fff}
.ext.pdf{background:#b3261e} .ext.xl{background:#1d6f42}
.mini{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:8px 9px;font:700 11px var(--body);cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.field{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
input,select{font:inherit;font-size:16px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.form{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.form .wide{flex:1 1 100%}
.form .price{flex:0 0 96px}
.form .catf{flex:1 1 140px}
.form .btn{width:auto;padding:12px 18px}
.x{border:0;background:none;color:var(--warn);font:600 13px var(--body);padding:8px;cursor:pointer}
.diff{font-weight:700;margin:0}
.diff.ok{color:var(--ok)} .diff.bad{color:var(--warn)}
.empty{text-align:center;color:var(--muted);padding:32px 12px;background:var(--surface);border:1px dashed var(--line);border-radius:14px;line-height:1.5}
.confirm{background:var(--surface);border:1px solid var(--warn);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:9;max-width:calc(100% - 32px);text-align:center}
.small{font-size:13px;color:var(--muted);line-height:1.45}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:9px 13px;font:600 13px var(--body);cursor:pointer}
.opts button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.form-v{display:flex;flex-direction:column;gap:14px;padding:14px}
.small.bad{color:var(--warn);font-weight:600}
.small.okc{color:var(--ok);font-weight:600}
.bars{display:flex;flex-direction:column;gap:7px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.bar-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 34px;gap:8px;align-items:center;font-size:13px;font-variant-numeric:tabular-nums}
.bar-row .bl{overflow-wrap:anywhere}.bar-row b{text-align:right}
.bt{height:10px;background:var(--bg);border-radius:6px;overflow:hidden}.bt span{display:block;height:100%;background:var(--gold);border-radius:6px}
.fr-row{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13px;font-variant-numeric:tabular-nums}
.fr-row b{white-space:nowrap}
.hrow{display:flex;align-items:center;gap:6px;padding:11px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.hrow:last-child{border-bottom:0}
.hrow .grow{flex:1;min-width:0}
.hrow .s{font-weight:700;white-space:nowrap}
.warnbox{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.45;margin-bottom:12px}
@media (prefers-reduced-motion:reduce){.tile{transition:none}}
</style>
</head>
<body>
<div id="home" hidden></div>
<div class="app" id="appSec">
  <header class="pad">
    <div class="brand"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M5 0h2v4h4v2H7v6H5V6H1V4h4z" fill="currentColor"/></svg>Monasterio La Santa Espina</div>
    <div class="secbar"><button class="back" data-home="1" aria-label="Volver al inicio">‹ Inicio</button><span class="secname" id="secName">Entradas</span></div>
    <div class="top">
      <div><div class="lbl" id="hLbl">Vendido en este turno</div><div class="total" id="hTotal">0,00 €</div></div>
      <div class="split">
        <span><span class="dot ef"></span>Efectivo <b id="hEf">0,00 €</b></span>
        <span><span class="dot tj"></span>Tarjeta <b id="hTj">0,00 €</b></span>
        <span><span class="dot vi"></span><span id="hViL">Visitantes</span> <b id="hVi">0</b></span>
        <span id="hVyW" hidden><span class="dot vy"></span>Venteya <b id="hVy">0</b></span>
      </div>
    </div>
    <div class="seg" id="seg" role="group" aria-label="Método de pago">
      <button data-m="ef" aria-pressed="true">Efectivo</button>
      <button data-m="tj" aria-pressed="false">Tarjeta</button>
      <button data-m="vy" aria-pressed="false" hidden>Venteya</button>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Secciones"></div>
  </header>
  <main class="pad">
    <section id="vVender"></section>
    <section id="vCaja" hidden></section>
    <section id="vCarta" hidden></section>
    <section id="vVisitas" hidden></section>
  </main>
  <div id="ticket" class="ticket pad" hidden></div>
  <nav class="pad"><div class="in" role="tablist">
    <button role="tab" data-v="Vender" aria-selected="true">Vender</button>
    <button role="tab" data-v="Caja" aria-selected="false">Caja</button>
    <button role="tab" data-v="Visitas" aria-selected="false">Encuesta</button>
    <button role="tab" data-v="Carta" aria-selected="false">Tarifas</button>
  </div></nav>
</div>
<div class="toast" id="toast" hidden></div>
<input type="file" id="fImport" accept=".json,application/json" hidden>

const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(u){let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRC[(c^u[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function zip(files){
  const enc=new TextEncoder(), parts=[], cen=[]; let off=0;
  const d=new Date(), dt=((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1))&0xFFFF, dd=(((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate())&0xFFFF;
  files.forEach(f=>{
    const name=enc.encode(f.name), data=enc.encode(f.data), crc=crc32(data);
    const h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint16(10,dt,true);h.setUint16(12,dd,true);
    h.setUint32(14,crc,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);h.setUint16(26,name.length,true);h.setUint16(28,0,true);
    parts.push(new Uint8Array(h.buffer),name,data);
    const c=new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);c.setUint16(12,dt,true);c.setUint16(14,dd,true);
    c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,name.length,true);
    c.setUint32(42,off,true);
    cen.push(new Uint8Array(c.buffer),name);
    off+=30+name.length+data.length;
  });
  const cs=cen.reduce((a,b)=>a+b.length,0), e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
  const all=[...parts,...cen,new Uint8Array(e.buffer)], out=new Uint8Array(all.reduce((a,b)=>a+b.length,0)); let p=0;
  all.forEach(b=>{out.set(b,p);p+=b.length;}); return out;
}
const xe=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function xlsxDe(c){
  const LT=c.lineas||[], L=LT.filter(x=>x.cant), esEnt=c.pagina==='ent', rows=[];
  // estilos: 0 normal, 1 negrita, 2 moneda, 3 negrita moneda, 4 título, 5 cabecera, 6 sección, 7 gris
  const S=(r,col,v,s,f)=>{ (rows[r]=rows[r]||[]).push({col,v,s:s||0,f}); };
  S(1,'A','Monasterio La Santa Espina',4);
  S(2,'A','Cierre de caja · '+(TIT[c.pagina]||''),7);
  S(3,'A','Desde',1); S(3,'B',fmtF(c.inicio));

  const H=['Sección','Artículo','PVP','Uds efectivo','Uds tarjeta','Unidades','Importe efectivo','Importe tarjeta','Importe'];
  H.forEach((h,i)=>S(6,'ABCDEFGHI'[i],h,5));
  const first=7;
  L.forEach((x,i)=>{ const r=first+i;
    S(r,'A',x.cat,6); S(r,'B',x.nombre); S(r,'C',x.precio,2); S(r,'D',x.ef); S(r,'E',x.tj);
    S(r,'F',x.cant,0,`D${r}+E${r}`); S(r,'G',r2(x.precio*x.ef),2,`C${r}*D${r}`); S(r,'H',r2(x.precio*x.tj),2,`C${r}*E${r}`); S(r,'I',x.subtotal,3,`C${r}*F${r}`); });
  const last=first+L.length-1, tr=Math.max(last+1,first);
  const R=resumen(L), sm=(col,v,s)=>S(tr,col,v,s,L.length?`SUM(${col}${first}:${col}${last})`:null);
  S(tr,'A','TOTAL',1); sm('D',L.reduce((a,x)=>a+x.ef,0),1); sm('E',L.reduce((a,x)=>a+x.tj,0),1); sm('F',R.uds,1); sm('G',R.tEf,3); sm('H',R.tTj,3); sm('I',R.total,3);
  let r=tr+2;
  const vyU=c.venteya?c.venteya.uds:0;
  if(esEnt&&vyU){ S(r,'A','Entradas Venteya (pagadas online, no entran en caja)',1); S(r,'C',vyU,1); S(r,'D',c.venteya.importe,3); r++;
    LT.filter(x=>x.vy).forEach(x=>{ S(r,'B','   '+x.nombre); S(r,'C',x.vy); r++; }); }
  if(esEnt){ S(r,'A','Visitantes',1); S(r,'C',R.uds+vyU,1,vyU?null:`F${tr}`); r++; }
  if(c.contado!=null){ S(r,'A','Efectivo contado en caja',1); S(r,'C',c.contado,2); r++;
    S(r,'A','Diferencia (contado − ventas en efectivo)',1); S(r,'C',r2(c.contado-R.tEf),3,`C${r-1}-G${tr}`); r++; }
  const cols='<col min="1" max="1" width="13" customWidth="1"/><col min="2" max="2" width="46" customWidth="1"/><col min="3" max="3" width="11" customWidth="1"/><col min="4" max="6" width="12" customWidth="1"/><col min="7" max="8" width="16" customWidth="1"/><col min="9" max="9" width="13" customWidth="1"/>';
  const hojas=[{nombre:NOMSEC[c.pagina]||'Caja',xml:hojaXML(rows,{cols,merge:'A1:I1',freeze:6})}];
  if(c.franjas&&c.franjas.length) hojas.push(hojaFranjas(c.franjas,'Cierre del '+fmtF(c.fecha),esEnt));
  if(esEnt&&c.visitas&&c.visitas.length) hojas.push(...hojasEncuesta(c.visitas,'Cierre del '+fmtF(c.fecha)));
  return libroXLSX(hojas);
}

function parseEntradas(txt){
  const t=String(txt||'').trim().replace(/[–—]/g,'-').replace(/\s+(?:a|al|hasta)\s+/gi,'-').replace(/\s*-\s*/g,'-');
  if(!t) return {nums:[],err:''};
  const set=new Set(), toks=t.split(/\s*[,;\/]\s*|\s+y\s+|\s+/).filter(Boolean);
  for(const tok of toks){
    let m;
    if(/^\d+$/.test(tok)) set.add(+tok);
    else if((m=tok.match(/^(\d+)-(\d+)$/))){
      let a=+m[1], b=+m[2]; if(a>b){const x=a;a=b;b=x;}
      if(b-a>999) return {nums:[],err:`El intervalo ${a}-${b} es demasiado grande`};
      for(let i=a;i<=b;i++) set.add(i);
    } else return {nums:[],err:`No entiendo «${tok}». Escribe números como 125 o intervalos como 125-130`};
  }
  return {nums:[...set].sort((a,b)=>a-b),err:''};
}
function compactar(nums){
  const n=[...nums].sort((a,b)=>a-b), out=[]; let i=0;
  while(i<n.length){ let j=i; while(j+1<n.length&&n[j+1]===n[j]+1) j++; out.push(j>i?`${n[i]}-${n[j]}`:String(n[i])); i=j+1; }
  return out.join(', ');
}
function todasVisitas(){
  const s=D.sec.ent, out=[];
  (s.visitas||[]).forEach(v=>out.push(v));

  return out.sort((a,b)=>a.hora-b.hora);
}

}

function hojasEncuesta(lista,titulo){
  // Hoja 1: una fila por visita

  S(1,'A','Monasterio La Santa Espina · Encuesta de visitantes',4); S(2,'A',titulo,7);
  const H=['Fecha','Hora','Nº de entradas','Primera','Última','Personas','Procedencia','Provincia / comunidad / país / localidad','Cómo nos conocieron'];
  H.forEach((h,i)=>S(4,'ABCDEFGHI'[i],h,5));
  lista.forEach((v,i)=>{ const r=5+i, x=serialXL(v.hora);
    S(r,'A',Math.floor(x),8); S(r,'B',x-Math.floor(x),9); S(r,'C',v.entradas||'');
    if(v.nums&&v.nums.length){ S(r,'D',v.nums[0]); S(r,'E',v.nums[v.nums.length-1]); }
    S(r,'F',+v.personas||0); S(r,'G',AMB[v.ambito]||''); S(r,'H',v.lugar||''); S(r,'I',v.como||''); });
  const last=4+lista.length, tr=last+1;
  S(tr,'A','TOTAL',1); S(tr,'F',lista.reduce((a,v)=>a+(+v.personas||0),0),1,lista.length?`SUM(F5:F${last})`:null);
  const cols1='<col min="1" max="1" width="12" customWidth="1"/><col min="2" max="2" width="8" customWidth="1"/><col min="3" max="3" width="24" customWidth="1"/><col min="4" max="6" width="10" customWidth="1"/><col min="7" max="7" width="24" customWidth="1"/><col min="8" max="8" width="34" customWidth="1"/><col min="9" max="9" width="28" customWidth="1"/>';
  // Hoja 2: resumen
  const r2=[], T=(r,col,v,s,f)=>{(r2[r]=r2[r]||[]).push({col,v,s:s||0,f});};
  const total=lista.reduce((a,v)=>a+(+v.personas||0),0);
  T(1,'A','Resumen de la encuesta',4); T(2,'A',titulo,7);
  T(3,'A','Personas registradas',1); T(3,'B',total,1); T(3,'D','Grupos',1); T(3,'E',lista.length,1);
  let r=5;
  const bloque=(nombre,pares)=>{ if(!pares.length) return; T(r,'A',nombre,5); T(r,'B','Personas',5); T(r,'C','%',5); r++;
    pares.forEach(([k,n])=>{ T(r,'A',k); T(r,'B',n); T(r,'C',total?n/total:0,10); r++; }); r++; };
  bloque('Procedencia',cuenta(lista,v=>AMB[v.ambito]).sort((a,b)=>ambitoOrden(a[0])-ambitoOrden(b[0])));
  bloque('Provincias de Castilla y León',cuenta(lista.filter(v=>v.ambito==='cyl'),v=>v.lugar));
  bloque('Otras comunidades',cuenta(lista.filter(v=>v.ambito==='esp'),v=>v.lugar));
  bloque('Países',cuenta(lista.filter(v=>v.ambito==='ext'),v=>v.lugar));
  bloque('Localidades de Valladolid',cuenta(lista.filter(v=>v.ambito==='vall'),v=>v.lugar));
  bloque('Cómo nos conocieron',cuenta(lista,v=>v.como));
  // por mes
  const mes=new Map(); lista.forEach(v=>{const d=new Date(v.hora),k=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;mes.set(k,(mes.get(k)||0)+(+v.personas||0));});
  const nomMes=k=>{const [y,m]=k.split('-');return new Date(+y,+m-1,1).toLocaleDateString('es-ES',{month:'long',year:'numeric'});};
  bloque('Por mes',[...mes.entries()].sort((a,b)=>a[0].localeCompare(b[0])).map(([k,n])=>[nomMes(k),n]));
  const cols2='<col min="1" max="1" width="34" customWidth="1"/><col min="2" max="3" width="11" customWidth="1"/><col min="4" max="5" width="9" customWidth="1"/>';
  return [{nombre:'Visitas',xml:hojaXML(rows,{cols:cols1,merge:'A1:I1',freeze:4})},{nombre:'Resumen encuesta',xml:hojaXML(r2,{cols:cols2})}];
}

  const k=D.pagina, L=cierresMes(k,UI.mes), tot=r2(L.reduce((a,c)=>a+c.total,0)), ef=r2(L.reduce((a,c)=>a+c.efectivo,0)), tj=r2(L.reduce((a,c)=>a+c.tarjeta,0)), dias=new Set(L.map(c=>new Date(c.fecha).toDateString())).size, share=puedeCompartir();
  return `<h3>Cierres del mes</h3>
  <div class="card semana"><div class="sem-nav"><button class="mini" data-mes="-1" aria-label="Mes anterior">‹</button><b>${nomMes(UI.mes)}</b><button class="mini" data-mes="1" ${UI.mes>=0?'disabled':''} aria-label="Mes siguiente">›</button></div>
  <p class="small">${L.length?`${L.length} ${L.length===1?'cierre':'cierres'} en ${dias} ${dias===1?'día':'días'} · <b>${eur(tot)}</b> (efectivo ${eur(ef)} · tarjeta ${eur(tj)})${k==='ent'&&L.some(c=>c.venteya&&c.venteya.uds)?` · ${L.reduce((a,c)=>a+(c.venteya?c.venteya.uds:0),0)} entradas Venteya`:''}`:'No hay cierres guardados este mes.'} Los cierres se guardan en este móvil; además, el día 1 llega por correo el resumen del mes anterior.</p>
  <div class="exp"${share?'':' style="grid-template-columns:1fr"'}><button class="btn" data-act="mesX" ${L.length?'':'disabled'}><span class="ext xl">XLSX</span>Excel del mes</button>${share?`<button class="btn" data-act="mesShare" ${L.length?'':'disabled'}>Enviar…</button>`:''}</div></div>`;
}
async function compartirX(x,titulo){
  try{ const file=new File([x.bytes],x.nombre,{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}); await navigator.share({files:[file],title:titulo,text:titulo+' · Monasterio La Santa Espina'}); }
  catch(e){ if(!e||e.name!=='AbortError') toast('No se pudo compartir; usa Descargar'); }
}
async function compartirSemana(){ try{ await compartirX(xlsxSemana(UI.semana),'Caja del bar · '+etiquetaSemana(UI.semana)); }catch(e){ toast('No se pudo crear el archivo'); } }


/* ================= envío automático de cierres ================= */
let enviando=false;
async function postEnvio(cuerpo){
  const r=await fetch(D.envio.url.trim(),{method:'POST',body:JSON.stringify(Object.assign({clave:D.envio.clave.trim(),movil:D.envio.movil.trim()||'Sin nombre'},cuerpo))});
  return r.json();
}
async function enviarCola(){
  if(enviando||!D.cola.length||!D.envio.url||!D.envio.clave||(navigator.onLine===false)) return;
  enviando=true;
  try{
    while(D.cola.length){
      const it=D.cola[0]; let res;
      try{ res=await postEnvio({id:it.id,cierre:it.cierre}); }catch(e){ break; }
      if(res&&res.ok){ D.cola.shift(); D.envio.ultimo=Date.now(); save(); }
      else { if(res&&res.error==='clave') toast('Envío automático: la clave no es correcta. Revísala en Tarifas.'); break; }
    }
  } finally { enviando=false; if(!UI.home&&UI.view==='Carta') render(); }
}
async function probarEnvio(){
  leerEnvio();
  if(!D.envio.url||!D.envio.clave) return toast('Pega la dirección y la clave');
  const box=document.getElementById('envRes'); if(box){ box.className='small'; box.textContent='Probando…'; }
  try{ const r=await postEnvio({prueba:true});
    if(r&&r.ok){ if(box){ box.className='small okc'; box.textContent='Conexión correcta. Los cierres se enviarán solos.'; } enviarCola(); }
    else if(box){ box.className='small bad'; box.textContent=r&&r.error==='clave'?'La clave no es correcta.':'El servicio ha respondido con un error.'; }
  }catch(e){ if(box){ box.className='small bad'; box.textContent='No se pudo conectar. Revisa la dirección y que haya internet.'; } }
}
function leerEnvio(){ const g=id=>{const e=document.getElementById(id);return e?e.value:null;}; ['movil','url','clave'].forEach(k=>{ const v=g('env_'+k); if(v!=null) D.envio[k]=v.trim(); }); save(); }
function bloqueEnvio(){
  const E=D.envio, on=E.url&&E.clave;
  return `<h3>Envío automático</h3>
  <p class="small">Cada cierre de caja se manda solo al registro central; a las 23:30 sale un correo con el Excel del día. Si no hay internet, se envía en cuanto la haya.</p>
  <div class="card form-v">
    <div class="field"><label class="lbl" for="env_movil">Nombre de este móvil</label><input id="env_movil" value="${esc(E.movil||'')}" placeholder="Ej. Recepción, Bar…" autocomplete="off"></div>
    <div class="field"><label class="lbl" for="env_url">Dirección del servicio</label><input id="env_url" value="${esc(E.url||'')}" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off" inputmode="url"></div>
    <div class="field"><label class="lbl" for="env_clave">Clave</label><input id="env_clave" value="${esc(E.clave||'')}" placeholder="La de la hoja «Configuración»" autocomplete="off"></div>
    <button class="btn" data-act="probarEnv">Guardar y probar conexión</button>
    <span id="envRes" class="small">${on?`${D.cola.length?`<b>${D.cola.length}</b> ${D.cola.length===1?'cierre pendiente':'cierres pendientes'} de enviar.`:'Todo enviado.'}${E.ultimo?' Último envío: '+fmtF(E.ultimo)+'.':''}`:'Desactivado: rellena los datos para activarlo.'}</span>
    ${D.cola.length&&on?'<button class="btn ghost" data-act="enviarYa">Enviar pendientes ahora</button>':''}
  </div>`;
}
window.addEventListener('online',enviarCola);
setInterval(enviarCola,60000);

/* ================= vistas ================= */
function grupos(ps){ const g=[]; ps.forEach(p=>{const k=p.cat||'Otros'; let x=g.find(y=>y.k===k); if(!x){x={k,ps:[]};g.push(x);} x.ps.push(p);}); return g.sort((a,b)=>catOrd(a.k)-catOrd(b.k)); }
function render(){
  document.body.classList.toggle('s-tie',!UI.home&&D.pagina==='tie'); document.body.classList.toggle('s-bar',!UI.home&&D.pagina==='bar');
  document.getElementById('home').hidden=!UI.home; document.getElementById('appSec').hidden=UI.home;
  if(UI.home){ renderHome(); renderTicket(); return; }
  const t=totales(), esEnt=D.pagina==='ent', esBar=D.pagina==='bar';
  document.getElementById('secName').textContent=NOMSEC[D.pagina];
  document.getElementById('hLbl').textContent=esEnt?'Entradas vendidas en este turno':esBar?'Bar: vendido en este turno':'Tienda: vendido en este turno';
  document.getElementById('hTotal').textContent=eur(t.total);
  document.getElementById('hEf').textContent=eur(t.tEf);
  document.getElementById('hTj').textContent=eur(t.tTj);
  document.getElementById('hViL').textContent=esEnt?'Visitantes':esBar?'Consumiciones':'Artículos';
  document.getElementById('hVi').textContent=t.uds+(esEnt?t.vy:0);
  document.getElementById('hVyW').hidden=!(esEnt&&t.vy); document.getElementById('hVy').textContent=t.vy;
  if(!esEnt&&D.metodo==='vy') D.metodo='ef';
  document.querySelector('#seg [data-m="vy"]').hidden=!esEnt; document.getElementById('seg').classList.toggle('tres',esEnt);
  const vend=UI.view==='Vender';
  document.getElementById('seg').hidden=!vend;
  document.querySelectorAll('#seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===D.metodo));
  document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===UI.view));
  if(!esEnt&&UI.view==='Visitas') UI.view='Vender';
  document.querySelector('nav [data-v="Visitas"]').hidden=!esEnt;
  document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===UI.view));
  ['Vender','Caja','Carta','Visitas'].forEach(v=>document.getElementById('v'+v).hidden=v!==UI.view);
  const cs=grupos(sec().productos).map(g=>g.k);
  if(UI.filtro!=='Todo'&&!cs.includes(UI.filtro)) UI.filtro='Todo';
  const ch=document.getElementById('chips'); ch.hidden=!vend||cs.length<3;
  ch.innerHTML=['Todo',...cs].map(c=>`<button data-f="${esc(c)}" aria-pressed="${UI.filtro===c}">${esc(c)}</button>`).join('');
  if(vend) renderVender();
  if(UI.view==='Caja') renderCaja(t);
  if(UI.view==='Carta') renderCarta();
  if(UI.view==='Visitas') renderVisitas(t);
  renderTicket();
}
function renderVender(){
  const el=document.getElementById('vVender'), m=D.metodo; el.className='m-'+m;
  if(!sec().productos.length){ el.innerHTML='<div class="empty">Aún no hay tarifas.<br>Añádelas en la pestaña <b>Tarifas</b>.</div>'; return; }
  const gs=grupos(sec().productos).filter(g=>UI.filtro==='Todo'||g.k===UI.filtro);
  el.innerHTML=(m==='vy'?`<p class="vybox"><b>Entradas de Venteya:</b> ya están pagadas online. Toca el tipo de entrada de cada persona que la enseñe; cuentan como visitantes pero no entran en el dinero de la caja.</p>`:'')+`<p class="hint">${m==='vy'?'Apuntando':'Cobrando en'} <b>${NOMBRE[m].toLowerCase()}</b>. Toca ${D.pagina==='ent'?'una entrada por cada persona':D.pagina==='bar'?'cada consumición; abajo ves el pedido y el cambio':'un artículo cada vez que lo vendas'}. El botón − quita uno.</p>`+
    gs.map(g=>`<h3 class="cat">${esc(g.k)}</h3><div class="grid">`+g.ps.map(p=>{
      const c=cnt(m,p.id), any=c||cnt('ef',p.id)+cnt('tj',p.id)+cnt('vy',p.id);
      return `<div class="cell"><button class="tile${c?' on':''}" data-add="${p.id}" aria-label="Sumar ${esc(p.nombre)}">
        <span class="n">${esc(p.nombre)}</span><span class="p${p.precio?'':' free'}">${p.precio?eur(p.precio):'Gratuita'}</span>
        ${c?`<span class="badge">${c}</span>`:''}</button>
        ${any?`<button class="minus" data-sub="${p.id}" aria-label="Quitar uno de ${esc(p.nombre)}">−</button>`:''}</div>`;
    }).join('')+'</div>').join('');
}
function cuadre(t){
  const c=parseFloat(String(UI.contado).replace(',','.'));
  if(UI.contado.trim()===''||isNaN(c)) return '';
  const d=c-t.tEf;
  return `<p class="diff ${Math.abs(d)<0.005?'ok':'bad'}">${Math.abs(d)<0.005?'El efectivo cuadra':(d>0?'Sobran ':'Faltan ')+eur(Math.abs(d))}</p>`;
}
function tabla(l,total){
  const hayVy=l.some(x=>x.vy);
  let h=`<div class="card"><div class="row head"><span class="grow">Artículo</span><span class="q">Efec.</span><span class="q">Tarj.</span>${hayVy?'<span class="q">Vtya.</span>':''}<span class="s">Importe</span></div>`, cat=null;
  l.forEach(x=>{ if(x.cat!==cat){cat=x.cat; h+=`<div class="row sub">${esc(cat)}</div>`;}
    h+=`<div class="row"><span class="grow">${esc(x.nombre)}</span><span class="q">${x.ef||'·'}</span><span class="q">${x.tj||'·'}</span>${hayVy?`<span class="q">${x.vy||'·'}</span>`:''}<span class="s">${x.precio?(x.cant?eur(x.subtotal):'—'):'Gratis'}</span></div>`; });
  return h+`<div class="row tot"><span class="grow">Total</span><span class="s">${eur(total)}</span></div></div>`;
}
function renderCaja(t){
  const el=document.getElementById('vCaja'), s=sec(), esEnt=D.pagina==='ent';
  const desde=new Date(s.inicio).toLocaleString('es-ES',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
  let h=`<h2>Caja de${esEnt?' entradas':D.pagina==='bar'?'l bar':' la tienda'}</h2><p class="small" style="margin:-6px 0 12px">Abierta desde ${desde}</p>
    <div class="sum"><div><span class="lbl"><span class="dot ef"></span>Efectivo</span><b>${eur(t.tEf)}</b></div>
    <div><span class="lbl"><span class="dot tj"></span>Tarjeta</span><b>${eur(t.tTj)}</b></div>
    <div><span class="lbl"><span class="dot vi"></span>${esEnt?'Visitas':'Artículos'}</span><b>${t.uds+(esEnt?t.vy:0)}</b></div></div>`;
  h+= t.l.length ? tabla(t.l,t.total) : '<div class="empty">Todavía no hay ventas en este turno.</div>';
  if(esEnt&&t.vy) h+=`<p class="vybox"><b>Entradas Venteya (pagadas online): ${t.vy}</b> · ${eur(t.tVy)}. Cuentan como visitantes, pero no están en el efectivo ni en la tarjeta de esta caja.</p>`;
  h+= bloqueFranjas(franjasDe(s,t),'Ventas por franja horaria',esEnt);
  h+=`<div class="stack"><div class="field"><label class="lbl" for="contado">Efectivo contado en caja (opcional)</label>
     <input id="contado" inputmode="decimal" placeholder="Debería haber ${eur(t.tEf)}" value="${esc(UI.contado)}"></div><div id="diffBox">${cuadre(t)}</div>`;
  if(t.uds||t.vy) h+=`<div class="exp"><button class="btn" data-exp="pdf" data-k="actual"><span class="ext pdf">PDF</span>Descargar PDF</button><button class="btn" data-exp="xlsx" data-k="actual"><span class="ext xl">XLSX</span>Descargar Excel</button></div>`;
  if(UI.confirmar) h+=`<div class="confirm"><b>¿Cerrar la caja con ${eur(t.total)}?</b><span class="small">${eur(t.tEf)} en efectivo y ${eur(t.tTj)} con tarjeta. ${esEnt&&(s.visitas||[]).length?` La encuesta (${s.visitas.length} grupos) va con el cierre.`:''} Se guarda en el historial y los contadores vuelven a cero.</span>
     <button class="btn danger" data-act="cerrar">Sí, cerrar caja</button><button class="btn ghost" data-act="cancelar">Cancelar</button></div>`;
  else h+=`<button class="btn" data-act="confirmar" ${t.uds||t.vy?'':'disabled'}>Cerrar caja</button>`;
  h+='</div>'+bloqueMes()+(D.pagina==='bar'?bloqueSemana():'')+'<h3>Cierres anteriores</h3>';
  if(!s.cierres.length) h+='<p class="small">Aquí aparecerá cada caja que cierres, con su PDF y su Excel.</p>';
  else h+='<div class="card">'+s.cierres.slice(0,60).map((x,i)=>{
      const f=new Date(x.fecha).toLocaleString('es-ES',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
      const dd=x.contado!=null?x.contado-x.efectivo:null;
      return `<div class="hrow"><span class="grow">${f} · <span class="s">${eur(x.total)}</span><br><span class="small">Efec. ${eur(x.efectivo)} · Tarj. ${eur(x.tarjeta)} · ${x.unidades} ${esEnt?'visit.':'uds'}${dd!=null&&Math.abs(dd)>=0.005?` · ${dd>0?'sobraron':'faltaron'} ${eur(Math.abs(dd))}`:''}</span></span>
        <button class="mini" data-exp="pdf" data-k="${i}" aria-label="PDF del cierre del ${f}">PDF</button><button class="mini" data-exp="xlsx" data-k="${i}" aria-label="Excel del cierre del ${f}">XLSX</button></div>`}).join('')+'</div>';
  el.innerHTML=h;
}
function renderCarta(){
  const el=document.getElementById('vCarta'), esEnt=D.pagina==='ent';
  let h=`<h2>Tarifas de${esEnt?' entradas':D.pagina==='bar'?'l bar':' la tienda'}</h2><form class="form" id="fAdd">
    <div class="field wide"><label class="lbl" for="pNombre">${esEnt?'Tipo de entrada':'Artículo'}</label><input id="pNombre" placeholder="${esEnt?'Ej. Peregrino':D.pagina==='bar'?'Ej. Tostada':'Ej. Rosario de madera'}" required></div>
    <div class="field catf"><label class="lbl" for="pCat">Sección</label><select id="pCat">${cats().map(c=>`<option>${c}</option>`).join('')}</select></div>
    <div class="field price"><label class="lbl" for="pPrecio">Precio €</label><input id="pPrecio" inputmode="decimal" placeholder="0 = gratis" required></div>
    <button class="btn" type="submit">Añadir</button></form>`;
  h+=grupos(sec().productos).map(g=>`<h3>${esc(g.k)}</h3><div class="card">`+g.ps.map(p=>`<div class="row"><span class="grow">${esc(p.nombre)}</span><span class="s">${p.precio?eur(p.precio):'Gratuita'}</span><button class="x" data-del="${p.id}" aria-label="Quitar ${esc(p.nombre)}">Quitar</button></div>`).join('')+'</div>').join('');
  h+=bloqueEnvio();
  h+=`<h3>Copia de seguridad</h3><p class="small">Todo se guarda en este móvil, sin internet. Si borras los datos del navegador se pierde, así que de vez en cuando guarda una copia.</p>
    <div class="exp" style="margin-top:10px"><button class="btn" data-act="backup">Guardar copia</button><button class="btn" data-act="restore">Recuperar copia</button></div>`;
  el.innerHTML=h;
}

/* ================= eventos ================= */
document.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.open) return abrirSeccion(b.dataset.open);
  if(b.dataset.home){ UI.home=true; UI.cambio=false; render(); window.scrollTo(0,0); return; }
  if(b.dataset.ent!=null){ UI.entrega=String(b.dataset.ent).replace('.',','); renderTicket(); return; }
  if(b.dataset.sem){ UI.semana=Math.min(0,UI.semana+(+b.dataset.sem)); render(); return; }
  if(b.dataset.mes){ UI.mes=Math.min(0,UI.mes+(+b.dataset.mes)); render(); return; }
  if(b.dataset.p){ D.pagina=b.dataset.p; UI.filtro='Todo'; UI.confirmar=false; UI.contado=''; save(); render(); window.scrollTo(0,0); return; }
  if(b.dataset.m){ D.metodo=b.dataset.m; save(); render(); return; }
  if(b.dataset.f){ UI.filtro=b.dataset.f; render(); return; }
  if(b.dataset.v){ UI.view=b.dataset.v; UI.confirmar=false; render(); window.scrollTo(0,0); return; }
  if(b.dataset.add) return sumar(b.dataset.add,1);
  if(b.dataset.sub) return sumar(b.dataset.sub,-1);
  if(b.dataset.del){ const s=sec(); s.productos=s.productos.filter(p=>p.id!==b.dataset.del); delete s.counts.ef[b.dataset.del]; delete s.counts.tj[b.dataset.del]; save(); render(); return; }
  if(b.dataset.amb){ if(UI.fv.ambito!==b.dataset.amb){UI.fv.ambito=b.dataset.amb; UI.fv.lugar='';} render(); return; }
  if(b.dataset.como){ UI.fv.como=b.dataset.como; render(); return; }
  if(b.dataset.delv){ const id=b.dataset.delv; if(UI.borrarV===id){ D.sec.ent.visitas=D.sec.ent.visitas.filter(v=>v.id!==id); UI.borrarV=null; save(); toast('Visita quitada'); } else UI.borrarV=id; render(); return; }
  if(b.dataset.exp){ const k=b.dataset.k; const c=k==='actual'?cierreActual():sec().cierres[+k]; if(c) exportar(b.dataset.exp,c); return; }
  const a=b.dataset.act;
  if(a==='confirmar'){UI.confirmar=true;render();}
  if(a==='cancelar'){UI.confirmar=false;render();}
  if(a==='cerrar') cerrarCaja();
  if(a==='guardarV') guardarVisita();
  if(a==='cambio'){ UI.cambio=!UI.cambio; UI.entrega=''; renderTicket(); if(UI.cambio){ const i=document.getElementById('entrega'); if(i) i.focus(); } }
  if(a==='nuevoPed'||a==='cobrado'){ UI.ticket={}; UI.cambio=false; UI.entrega=''; renderTicket(); if(a==='cobrado') toast('Cobrado'); }
  if(a==='semX'){ try{ const x=xlsxSemana(UI.semana); descargar(x.nombre,x.bytes,'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'); }catch(e){ toast('No se pudo crear el archivo'); } }
  if(a==='semShare') compartirSemana();
  if(a==='mesX'){ try{ const x=xlsxMes(UI.mes); descargar(x.nombre,x.bytes,'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'); }catch(e){ toast('No se pudo crear el archivo'); } }
  if(a==='mesShare'){ try{ compartirX(xlsxMes(UI.mes),TIT[D.pagina]+' · '+nomMes(UI.mes)); }catch(e){ toast('No se pudo crear el archivo'); } }
  if(a==='probarEnv') probarEnvio();
  if(a==='enviarYa') enviarCola();
  if(a==='encuestaX') descargarEncuesta();
  if(a==='backup') descargar('santa-espina_copia_'+stamp(Date.now())+'.json',new TextEncoder().encode(JSON.stringify(D)),'application/json');
  if(a==='restore') document.getElementById('fImport').click();
});
document.getElementById('fImport').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{ try{ const x=JSON.parse(rd.result); if(!x||!x.sec||!x.sec.ent||!x.sec.tie) throw 0; D=x; if(!D.sec.bar) D.sec.bar=nuevaSec('bar'); save(); render(); toast('Copia recuperada'); }catch(err){ toast('Ese archivo no es una copia de esta app'); } e.target.value=''; };
  rd.readAsText(f);
});
document.addEventListener('input',e=>{
  if(e.target.id&&e.target.id.startsWith('env_')){ const k=e.target.id.slice(4); D.envio[k]=e.target.value.trim(); save(); }
  if(e.target.id==='entrega'){ UI.entrega=e.target.value; resCambio(); }
  if(e.target.id==='vEnt'){ UI.fv.entradas=e.target.value; previewEntradas(); }
  if(e.target.id==='vPers'){ UI.fv.personas=e.target.value.replace(/\D/g,''); UI.fv.pTocado=e.target.value!==''; }
  if(e.target.id==='vLug'){ UI.fv.lugar=e.target.value; }
  if(e.target.id==='contado'){ UI.contado=e.target.value; document.getElementById('diffBox').innerHTML=cuadre(totales()); }
});
document.addEventListener('change',e=>{ if(e.target.id==='vLug') UI.fv.lugar=e.target.value; });
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&(e.target.id==='vEnt'||e.target.id==='vPers')){ e.preventDefault(); const n=document.querySelector('[data-amb]'); if(n) n.focus(); } });
document.addEventListener('submit',e=>{
  if(e.target.id!=='fAdd') return; e.preventDefault();
  const n=document.getElementById('pNombre').value.trim(), p=parseFloat(document.getElementById('pPrecio').value.replace(',','.')), cat=document.getElementById('pCat').value;
  if(!n||isNaN(p)||p<0){toast('Escribe un nombre y un precio válido (0 si es gratuita)');return;}
  sec().productos.push({id:uid(),nombre:n,precio:r2(p),cat}); save(); render(); toast('Añadido: '+n);
});
let tt; function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2600);}

(function conectarDesdeEnlace(){
  try{
    const q=new URLSearchParams(location.search), c=q.get('conectar'); if(!c) return;
    const b=c.replace(/-/g,'+').replace(/_/g,'/'), j=JSON.parse(decodeURIComponent(escape(atob(b+'==='.slice((b.length+3)%4)))));
    if(!j.u||!j.k) return;
    D.envio.url=j.u; D.envio.clave=j.k;
    history.replaceState(null,'',location.pathname);
    UI.home=false; UI.view='Carta'; UI.conectado=true;
  }catch(e){}
})();
save(); render(); setTimeout(enviarCola,1500);
if(UI.conectado){ setTimeout(()=>{ toast('Envío automático configurado. Escribe el nombre de este móvil.'); const i=document.getElementById('env_movil'); if(i){ i.scrollIntoView({block:'center'}); i.focus(); } },400); }
try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
